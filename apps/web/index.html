<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <meta name="description" content="La Voz Misionera provides free worship chord sheets and lyrics for churches, worship teams, and believers." />
    <title>La Voz Misionera</title>
    <!-- App name in the raw HTML head so crawlers and Google's OAuth branding
         review read "La Voz Misionera" without executing JS. og:site_name and the
         WebSite/Organization JSON-LD declare the name explicitly; the React app
         (react-helmet) refines these per route after mount. -->
    <meta property="og:site_name" content="La Voz Misionera" />
    <meta property="og:title" content="La Voz Misionera" />
    <meta property="application-name" content="La Voz Misionera" />
    <!-- Apple Smart App Banner (iOS Safari only). Static rather than
         Helmet-driven: Safari reads this at page load and does not re-read it
         on SPA navigation. No app-argument — Universal Links (see
         public/.well-known/apple-app-site-association) already deep-link real
         taps, and index.html cannot know the current route at build time. -->
    <meta name="apple-itunes-app" content="app-id=6787127446" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "La Voz Misionera",
        "alternateName": "LaVozMisionera.com",
        "url": "%VITE_SITE_URL%/",
        "publisher": {
          "@type": "Organization",
          "name": "La Voz Misionera",
          "url": "%VITE_SITE_URL%/"
        }
      }
    </script>
    <!-- Preload variable font to cut requests and improve LCP -->
    <link
      rel="preload"
      href="/fonts/Inter-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Favicon bundle (LVM circular gradient emblem; path-versioned under /icons/v2 to bust caches) -->
    <link rel="icon" type="image/svg+xml" href="/icons/v4/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/v4/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/v4/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/v4/favicon-16x16.png">
    <link rel="shortcut icon" href="/icons/v4/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1C2A39">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D1624">
  </head>
  <body>
    <div id="root">
      <!-- Crawler-visible fallback for OAuth branding verification. Visually
           hidden (no flash before React mounts) but present in the raw HTML
           and accessibility tree. React replaces #root on mount. Uses inline
           styles on each element rather than a wrapper <div>, because the
           post-build SEO script matches #root with a non-greedy regex that
           stops at the first </div>. -->
      <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">La Voz Misionera</h1>
      <p style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">La Voz Misionera is a free, open-source worship tool for churches and worship teams to browse chord charts, build service setlists, and create printable songbooks.</p>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
