name: PR Checks

# Web checks are blocking. Mobile/token checks retain their existing policy.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Release guard tests
        run: node --test infra/vps/check-worship-release.test.mjs

      - name: Candidate includes deployed Worship
        run: node infra/vps/check-worship-release.mjs

      - name: Web locale parity
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Tests
        # Any test failure is a regression. Root
        # script delegates to the @lavozmisionera/web workspace.
        run: npm run test:run

      - name: Build (vite only)
        # Skip the SEO/sitemap scripts that need a real Supabase service-role
        # key — only the bundle compile matters for a PR check. Run from the web
        # workspace so Vite finds apps/web/vite.config.js + index.html.
        working-directory: apps/web
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npx vite build

      - name: Install browser for visual QA
        run: npm exec -w @lavozmisionera/web -- playwright install --with-deps chromium

      - name: Spanish editor visual QA (isolated session, no API writes)
        run: |
          npm exec -w @lavozmisionera/web -- vite preview --host 127.0.0.1 --port 4173 &
          node apps/web/scripts/verify-editor-locale.mjs

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-locale-qa
          path: test-results/editor-locale/

  # apps/mobile had no CI at all until now — its typecheck/test/i18n:check
  # scripts existed but nothing ran them, and every root script delegates to
  # @lavozmisionera/web only. Warn-only to match the job above; these are the
  # cheap, OS-independent checks (no Xcode, no Gradle, no simulator).
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck (warn-only)
        continue-on-error: true
        run: npm run typecheck -w @lavozmisionera/mobile

      - name: Tests (warn-only)
        continue-on-error: true
        run: npm run test -w @lavozmisionera/mobile

      - name: i18n parity (warn-only)
        continue-on-error: true
        # The mobile script reads locales/ off disk; the root i18n:check only
        # covers the web workspace, so this has to be invoked directly.
        run: npm run i18n:check -w @lavozmisionera/mobile

  # apps/studio consumes packages/tokens as a *committed* Swift mirror (an Xcode
  # build cannot run node), so the only thing keeping it honest is regenerating
  # and comparing. Separate job because it needs Node 22.18+ for TypeScript type
  # stripping, and bumping the job above would change what the web checks run on.
  #
  # Warn-only to match this file's convention, but unlike lint/test this check is
  # deterministic and starts green — it is a good candidate to make required.
  token-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Design tokens match their generated Swift (warn-only)
        continue-on-error: true
        # Invoked directly rather than through `npm run tokens:swift:check` so it
        # needs no install step — the generator has no dependencies and reads
        # native.ts directly.
        run: node packages/tokens/generate-swift.mjs --check
