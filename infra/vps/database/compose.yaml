name: lvm-worship
services:
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_DB: lvm_worship
      POSTGRES_USER: lvm_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lvm_owner -d lvm_worship']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
volumes:
  postgres_data:
networks:
  database:
    internal: true
