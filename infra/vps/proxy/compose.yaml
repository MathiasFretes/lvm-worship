name: shared-proxy
services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
networks:
  proxy:
    name: shared-proxy
